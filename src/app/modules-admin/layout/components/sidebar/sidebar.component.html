<nav class="hidden lg:flex h-full flex-col justify-between
         transition-[width] duration-300 ease-out
         text-gray-200
         bg-gradient-to-br from-[#0a4f52] via-[#147c7f] to-[#0f6e73]
         shadow-[inset_-1px_0_0_rgba(255,255,255,0.05)]
         relative overflow-hidden" [ngClass]="menuService.showSideBar ? 'w-[240px] xl:w-[300px]' : 'w-[78px]'"
  role="navigation" aria-label="Sidebar">

  <!-- Background layers -->
  <div class="absolute inset-0 -z-10
              bg-gradient-to-br from-[#071a1d] via-[#0a4f52] to-[#0f6e73]"></div>

  <!-- Glow -->
  <div class="absolute inset-0 -z-10 opacity-70
    bg-[radial-gradient(circle_at_20%_10%,rgba(28,197,201,0.22),transparent_55%),
        radial-gradient(circle_at_90%_0%,rgba(15,110,115,0.20),transparent_60%),
        radial-gradient(circle_at_50%_120%,rgba(0,0,0,0.55),transparent_60%)]">
  </div>

  <!-- Film overlay -->
  <div class="absolute inset-0 -z-10 bg-black/15"></div>

  <!-- TOP -->
  <div class="min-h-0 flex-1 flex flex-col overflow-hidden">
    <!-- Brand / Toggle -->
    <div class="px-3 pt-3 pb-3">
      <div class="flex items-center" [ngClass]="menuService.showSideBar ? 'justify-between' : 'justify-center'">

        <!-- Brand (expanded only) -->
        <div class="flex items-center gap-2" *ngIf="menuService.showSideBar">
          <!-- <button (click)="toggleSidebar()" class="group grid place-items-center size-10 rounded-xl
                   border border-white/10 bg-white/5 backdrop-blur
                   shadow-[0_10px_30px_rgba(0,0,0,0.35)]
                   transition-all duration-300
                   hover:bg-white/10 hover:-translate-y-[1px]
                   focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/55">
            <svg-icon src="assets/icons/logo.svg"></svg-icon>
          </button> -->

          <div class="ml-1 min-w-0">
            <b class="block text-sm font-extrabold tracking-wide text-white truncate" i18n="@@homeTitle">
              พอร์ทัลผู้ทำบัญชี
            </b>
            <span class="block text-[10px] text-white/50 truncate">Backoffice Suite</span>
          </div>
        </div>

        <!-- Toggle button -->
        <!-- <button (click)="toggleSidebar()" class="group grid place-items-center size-10 rounded-xl
                 border border-white/10 bg-white/5 backdrop-blur
                 text-white/70 hover:text-white
                 shadow-[0_10px_30px_rgba(0,0,0,0.30)]
                 transition-all duration-300
                 hover:bg-white/10 hover:-translate-y-[1px]
                 focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/55"
          [attr.aria-expanded]="menuService.showSideBar" [ngClass]="{ 'rotate-180': !menuService.showSideBar }">
          <svg-icon src="assets/icons/heroicons/solid/chevron-double-left.svg"></svg-icon>
        </button> -->

      </div>
    </div>

    <!-- Divider glow -->
    <div class="h-px mx-3 bg-gradient-to-r from-transparent via-white/15 to-transparent"></div>

    <!-- MENU SCROLL -->
    <div class="relative flex-1 overflow-auto px-3 py-3
             [scrollbar-width:thin] scrollbar-thin
             scrollbar-track-transparent scrollbar-thumb-white/10 hover:scrollbar-thumb-white/20">

      <!-- top fade -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-6
                  bg-gradient-to-b from-black/25 to-transparent"></div>

      <!-- bottom fade -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-0 h-6
                  bg-gradient-to-t from-black/25 to-transparent"></div>

      <!-- App Menu -->
      <div class="mt-2">
        <app-sidebar-menu></app-sidebar-menu>
      </div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="px-3 pb-3 space-y-2">
    <div class="h-px mx-0 bg-gradient-to-r from-transparent via-white/15 to-transparent"></div>

    <!-- Actions row -->
    <div class="flex items-center gap-2" [ngClass]="menuService.showSideBar ? 'justify-between' : 'justify-center'">

      <!-- Version pill -->
      <a target="_blank" href="" class="group relative inline-flex items-center rounded-xl
                border border-white/10 bg-white/5 backdrop-blur
                px-3 py-2
                transition-all duration-300
                hover:bg-white/10 hover:-translate-y-[1px]
                shadow-[0_10px_30px_rgba(0,0,0,0.30)]">

        <svg-icon src="assets/icons/heroicons/outline/information-circle.svg"
          [svgClass]="'h-4 w-4 text-white/60 group-hover:text-white'">
        </svg-icon>

        <!-- Expanded label -->
        <div class="ml-2 truncate text-[11px] font-semibold tracking-wide hidden"
          [ngClass]="{ 'sm:inline': menuService.showSideBar }">
          <span class="px-2 py-0.5 rounded-lg
                       bg-[#1cc5c9]/10 text-[#bffcff]
                       border border-[#1cc5c9]/20">
            v{{ appJson.version }}
          </span>
        </div>

        <!-- Tooltip when collapsed -->
        <span *ngIf="!menuService.showSideBar" class="pointer-events-none absolute left-full ml-3 top-1/2 -translate-y-1/2
                     origin-left scale-0 opacity-0 group-hover:scale-100 group-hover:opacity-100
                     transition-all duration-200
                     rounded-xl border border-white/10 bg-black/70 backdrop-blur
                     text-white text-xs font-semibold px-3 py-2 shadow-2xl">
          v{{ appJson.version }}
        </span>
      </a>

      <!-- Expanded: Settings + Profile -->
      <div *ngIf="menuService.showSideBar" class="flex items-center gap-2">
        <button type="button" class="group grid place-items-center size-10 rounded-xl
                 border border-white/10 bg-white/5 backdrop-blur
                 text-white/70 hover:text-white
                 transition-all duration-300
                 hover:bg-white/10 hover:-translate-y-[1px]
                 focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/45">
          <svg-icon src="assets/icons/heroicons/outline/cog-6-tooth.svg" [svgClass]="'h-5 w-5'"></svg-icon>
        </button>

        <button type="button" class="group flex items-center gap-2 rounded-xl
                 border border-white/10 bg-white/5 backdrop-blur
                 px-2.5 py-2 text-left
                 transition-all duration-300
                 hover:bg-white/10 hover:-translate-y-[1px]
                 focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/45">
          <img class="size-8 rounded-xl object-cover ring-1 ring-white/10"
            src="https://avatars.githubusercontent.com/u/12519008?v=4" alt="avatar" />
          <div class="leading-tight min-w-0">
            <div class="text-[12px] font-semibold text-white truncate">Accountant</div>
            <div class="text-[10px] text-white/50 truncate">Signed in</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Collapsed-only mini buttons -->
    <div *ngIf="!menuService.showSideBar" class="flex items-center justify-center gap-2">
      <button type="button" class="group relative grid place-items-center size-10 rounded-xl
               border border-white/10 bg-white/5 backdrop-blur
               text-white/70 hover:text-white
               transition-all duration-300
               hover:bg-white/10 hover:-translate-y-[1px]
               focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/45">
        <svg-icon src="assets/icons/heroicons/outline/cog-6-tooth.svg" [svgClass]="'h-5 w-5'"></svg-icon>

        <span class="pointer-events-none absolute left-full ml-3 top-1/2 -translate-y-1/2
                     origin-left scale-0 opacity-0 group-hover:scale-100 group-hover:opacity-100
                     transition-all duration-200
                     rounded-xl border border-white/10 bg-black/70 backdrop-blur
                     text-white text-xs font-semibold px-3 py-2 shadow-2xl">
          Settings
        </span>
      </button>

      <button type="button" class="group relative grid place-items-center size-10 rounded-xl
               border border-white/10 bg-white/5 backdrop-blur
               text-white/70 hover:text-white
               transition-all duration-300
               hover:bg-white/10 hover:-translate-y-[1px]
               focus:outline-none focus:ring-2 focus:ring-rose-400/35">
        <svg-icon src="assets/icons/heroicons/outline/power.svg" [svgClass]="'h-5 w-5'"></svg-icon>

        <span class="pointer-events-none absolute left-full ml-3 top-1/2 -translate-y-1/2
                     origin-left scale-0 opacity-0 group-hover:scale-100 group-hover:opacity-100
                     transition-all duration-200
                     rounded-xl border border-white/10 bg-black/70 backdrop-blur
                     text-white text-xs font-semibold px-3 py-2 shadow-2xl">
          Logout
        </span>
      </button>
    </div>
  </div>
</nav>

<nav class="hidden lg:flex h-full flex-col justify-between
         transition-[width] duration-300 ease-out
         text-gray-200
         bg-gradient-to-br from-[#0a4f52] via-[#147c7f] to-[#0f6e73]
         shadow-[inset_-1px_0_0_rgba(255,255,255,0.05)]
         relative overflow-hidden" [ngClass]="menuService.showSideBar ? 'w-[240px] xl:w-[300px]' : 'w-[78px]'"
  role="navigation" aria-label="Sidebar">

  <!-- Background layers -->
  <div class="absolute inset-0 -z-10
              bg-gradient-to-br from-[#071a1d] via-[#0a4f52] to-[#0f6e73]"></div>

  <!-- Glow -->
  <div class="absolute inset-0 -z-10 opacity-70
    bg-[radial-gradient(circle_at_20%_10%,rgba(28,197,201,0.22),transparent_55%),
        radial-gradient(circle_at_90%_0%,rgba(15,110,115,0.20),transparent_60%),
        radial-gradient(circle_at_50%_120%,rgba(0,0,0,0.55),transparent_60%)]">
  </div>

  <!-- Film overlay -->
  <div class="absolute inset-0 -z-10 bg-black/15"></div>

  <!-- TOP -->
  <div class="min-h-0 flex-1 flex flex-col overflow-hidden">
    <!-- Brand / Toggle -->
    <div class="px-3 pt-3 pb-3">
      <div class="flex items-center" [ngClass]="menuService.showSideBar ? 'justify-between' : 'justify-center'">

        <!-- Brand (expanded only) -->
        <div class="flex items-center gap-2" *ngIf="menuService.showSideBar">
          <!-- <button (click)="toggleSidebar()" class="group grid place-items-center size-10 rounded-xl
                   border border-white/10 bg-white/5 backdrop-blur
                   shadow-[0_10px_30px_rgba(0,0,0,0.35)]
                   transition-all duration-300
                   hover:bg-white/10 hover:-translate-y-[1px]
                   focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/55">
            <svg-icon src="assets/icons/logo.svg"></svg-icon>
          </button> -->

          <div class="ml-1 min-w-0">
            <b class="block text-sm font-extrabold tracking-wide text-white truncate" i18n="@@homeTitle">
              พอร์ทัลผู้ทำบัญชี
            </b>
            <span class="block text-[10px] text-white/50 truncate">Backoffice Suite</span>
          </div>
        </div>

        <!-- Toggle button -->
        <!-- <button (click)="toggleSidebar()" class="group grid place-items-center size-10 rounded-xl
                 border border-white/10 bg-white/5 backdrop-blur
                 text-white/70 hover:text-white
                 shadow-[0_10px_30px_rgba(0,0,0,0.30)]
                 transition-all duration-300
                 hover:bg-white/10 hover:-translate-y-[1px]
                 focus:outline-none focus:ring-2 focus:ring-[#1cc5c9]/55"
          [attr.aria-expanded]="menuService.showSideBar" [ngClass]="{ 'rotate-180': !menuService.showSideBar }">
          <svg-icon src="assets/icons/heroicons/solid/chevron-double-left.svg"></svg-icon>
        </button> -->

      </div>
    </div>

    <!-- Divider glow -->
    <div class="h-px mx-3 bg-gradient-to-r from-transparent via-white/15 to-transparent"></div>

    <!-- MENU SCROLL -->
    <div class="relative flex-1 overflow-auto px-3 py-3
             [scrollbar-width:thin] scrollbar-thin
             scrollbar-track-transparent scrollbar-thumb-white/10 hover:scrollbar-thumb-white/20">

      <!-- top fade -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-6
                  bg-gradient-to-b from-black/25 to-transparent"></div>

      <!-- bottom fade -->
      <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-0 h-6
                  bg-gradient-to-t from-black/25 to-transparent"></div>

      <!-- App Menu -->
      <div class="mt-2">
        <app-sidebar-menu></app-sidebar-menu>
      </div>
    </div>
  </div>
</nav>

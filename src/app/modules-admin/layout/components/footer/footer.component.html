<footer
  class="relative overflow-hidden border-t border-white/10 bg-gradient-to-br from-[#0a4f52] via-[#147c7f] to-[#0f6e73] text-white">
  <div
    class="bg-[radial-gradient(circle_at_20%_0%,rgba(28,197,201,0.16),transparent_55%), radial-gradient(circle_at_85%_0%,rgba(15,110,115,0.14),transparent_60%), radial-gradient(circle_at_50%_110%,rgba(0,0,0,0.55),transparent_65%)] pointer-events-none absolute inset-0 opacity-60"></div>

  <div class="relative mx-auto max-w-7xl px-4 py-8 sm:px-6 sm:py-8 lg:px-8">
    <div class="grid grid-cols-1 gap-8 text-center sm:grid-cols-2 sm:gap-10 sm:text-left lg:grid-cols-3">
      <div class="flex flex-col items-center sm:items-start">
        <div class="flex items-center gap-3">
          <div
            class="rounded-xl border border-[#19a7aa]/25 bg-white/5 p-2 shadow-[0_10px_30px_rgba(15,110,115,0.18)] backdrop-blur">
            <img src="assets/images/logo.png" alt="Logo" class="h-8 w-8 rounded-md" />
          </div>

          <span
            class="text-base font-extrabold tracking-tight text-white [text-shadow:0_0_24px_rgba(20,124,127,0.35)] sm:text-lg"
            i18n="@@org_name">
            ศูนย์รวมศิลปินการแสดงไทย
          </span>
        </div>

        <p class="mt-3 max-w-xs text-xs leading-relaxed text-white/90 sm:mt-4 sm:text-sm" i18n="@@footer_note">
          พื้นที่สร้างสรรค์เพื่อศิลปะการละคร และชุมชนผู้ชม
        </p>

        <div
          class="via-[#1cc5c9]/55 mt-4 h-px w-32 bg-gradient-to-r from-transparent to-transparent sm:mt-6 sm:w-40"></div>
      </div>
    </div>

    <div class="hidden lg:flex my-2 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

    <div
      class="flex flex-col items-center justify-between gap-3 text-center text-xs sm:flex-row sm:text-left sm:text-sm">
      <p class="text-white/55">
        &copy; {{ year }} <label i18n="@@org_name">ศูนย์รวมศิลปินการแสดงไทย.</label> All rights reserved.
      </p>

      <div class="text-white/55 flex items-center gap-2 sm:gap-3">
        <a href="#" class="transition hover:text-[#bffcff]" i18n="@@footer_privacyPolicy">นโยบายความเป็นส่วนตัว</a>
        <span class="text-white/25">|</span>
        <a href="#" class="transition hover:text-[#bffcff]" i18n="@@footer_termsOfService">ข้อตกลงการใช้งาน</a>
      </div>
    </div>
  </div>
</footer>

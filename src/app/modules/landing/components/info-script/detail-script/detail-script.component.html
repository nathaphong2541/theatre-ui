<!-- src/app/pages/detail-script/detail-script.component.html -->
<div class="min-h-[calc(100vh-4rem)] bg-[#020617] px-4 py-6 md:px-8 md:py-8">
    <div class="mx-auto max-w-5xl">
        <!-- ปุ่มกลับ -->
        <a routerLink="/theatre-library"
            class="mb-4 inline-flex items-center text-xs md:text-sm text-white/60 hover:text-white transition">
            ← กลับไปหน้าคลังบทละคร
        </a>

        <!-- Loading & Error -->
        <div *ngIf="loading" class="mt-4 text-sm text-white/60">
            กำลังโหลดข้อมูลบทละคร...
        </div>

        <div *ngIf="!loading && error" class="mt-4 text-sm text-red-400">
            {{ error }}
        </div>

        <!-- ข้อมูลบทละคร -->
        <ng-container *ngIf="!loading && !error && script as s">
            <div class="grid gap-6 md:grid-cols-[minmax(0,2fr)_minmax(0,1.2fr)] items-start">
                <!-- ข้อมูลหลัก -->
                <div>
                    <h1 class="mb-2 text-2xl md:text-3xl font-semibold text-white tracking-tight">
                        {{ s.title }}
                    </h1>

                    <p class="mb-1 text-xs md:text-sm text-white/60">
                        โดย {{ s.createdByName || 'ไม่ระบุผู้เขียน' }}
                    </p>

                    <p class="mb-3 text-[11px] md:text-xs text-white/40">
                        สร้างเมื่อ:
                        {{ s.createdAt ? (s.createdAt | date : 'dd/MM/yyyy HH:mm') : '-' }}
                    </p>

                    <!-- แท็ก -->
                    <div *ngIf="getTagList(s).length > 0" class="mb-4 flex flex-wrap gap-2">
                        <span *ngFor="let tag of getTagList(s)"
                            class="inline-flex rounded-full bg-white/5 px-3 py-0.5 text-[11px] text-white/70">
                            #{{ tag }}
                        </span>
                    </div>

                    <!-- คำอธิบาย -->
                    <p class="whitespace-pre-line text-sm md:text-base leading-relaxed text-white/80">
                        {{ s.description || 'ยังไม่มีคำอธิบายเพิ่มเติมสำหรับบทละครนี้' }}
                    </p>

                    <!-- ปุ่ม PDF -->
                    <div class="mt-6 flex flex-wrap gap-3">
                        <a *ngIf="getPdfUrl(s) as pdfUrl" [href]="pdfUrl" target="_blank" rel="noopener"
                            class="inline-flex items-center rounded-full border border-white/10 bg-[#111827] px-4 py-1.5 text-xs md:text-sm font-medium text-white hover:bg-white hover:text-black transition">
                            เปิด PDF บทละคร
                        </a>
                    </div>
                </div>

                <!-- รูปปก -->
                <div class="overflow-hidden rounded-xl border border-white/10 bg-black/40">
                    <img [src]="getCover(s) || 'assets/images/script-placeholder.jpg'" alt="script cover"
                        class="h-full w-full object-cover" />
                </div>
            </div>
        </ng-container>
    </div>
</div>

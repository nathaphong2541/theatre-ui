<section class="bg-[#0b1417] text-white px-4 py-5 md:px-6 md:py-6 shadow-[0_18px_60px_rgba(0,0,0,0.85)]">
    <!-- Header -->
    <div class="mx-auto max-w-7xl">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 i18n="@@landing_script_text_1" class="text-3xl md:text-xl font-semibold text-[#8aab06]">
                    บทละครใหม่ล่าสุด
                </h2>
                <p i18n="@@landing_script_text_2" class="text-xs md:text-sm text-white/60">
                    แสดงบทละครสาธารณะใหม่ล่าสุดสูงสุด 5 เรื่อง หากต้องการดูทั้งหมด กดปุ่มด้านขวา
                </p>
            </div>

            <button i18n="@@view_all" type="button" (click)="onViewAll()" class="inline-flex items-center rounded-full border border-[#8aab06]/70 bg-[#111827] px-4 py-1.5 text-xs md:text-sm font-medium text-[#e5f5a3]
             hover:bg-[#8aab06] hover:text-black hover:shadow-[0_0_12px_rgba(111,145,6,0.9)] transition">
                ดูทั้งหมด
            </button>
        </div>

        <!-- Loading -->
        <div *ngIf="loading" class="mt-3 text-xs md:text-sm text-white/60">
            กำลังโหลดบทละคร...
        </div>

        <!-- Error -->
        <div *ngIf="!loading && error" class="mt-3 text-xs md:text-sm text-red-300">
            {{ error }}
        </div>

        <!-- Empty -->
        <div i18n="@@no_public_scripts" *ngIf="!loading && !error && scripts.length === 0"
            class="mt-3 rounded-2xl border border-[#3f4d1f] bg-[#0a0f13] px-4 py-6 text-center text-xs md:text-sm text-white/60">
            ยังไม่มีบทละครสาธารณะให้แสดง
        </div>

        <!-- List: การ์ด 5 ใบ แถวเดียว เลื่อนข้างได้ -->
        <div class="flex gap-4 overflow-x-auto pb-3 snap-x snap-mandatory">
            <article *ngFor="let s of scripts" class="group snap-start shrink-0 w-[220px] overflow-hidden rounded-2xl
         border border-white/10 bg-white/5 shadow-sm transition
         hover:border-[#8aab06]/60 hover:shadow-[0_10px_28px_rgba(0,0,0,0.35)]
         flex flex-col">
                <!-- Cover (สูงเท่ากันอยู่แล้วด้วย aspect) -->
                <div class="relative aspect-[3/4] w-full overflow-hidden bg-[#0b1610]">
                    <img *ngIf="getCover(s) as cover" [src]="cover" [alt]="s.title"
                        class="h-full w-full object-cover object-center transition duration-300 group-hover:scale-[1.03]" />

                    <div *ngIf="!getCover(s)"
                        class="flex h-full w-full items-center justify-center px-3 text-center text-[12px] text-white/60">
                        ไม่มีรูปปก
                    </div>
                </div>

                <!-- Info panel: ทำให้เท่ากัน -->
                <div class="bg-black/40 p-3 flex flex-col flex-1">
                    <!-- title: ล็อก 2 บรรทัด -->
                    <h3
                        class="line-clamp-2 min-h-[34px] text-[13px] font-semibold text-white group-hover:text-[#e5f5a3]">
                        {{ s.title }}
                    </h3>

                    <!-- tags: ล็อกพื้นที่ (เช่น 2 บรรทัด) -->
                    <div class="mt-2 min-h-[34px]">
                        <div class="flex flex-wrap gap-1 line-clamp-2 overflow-hidden" *ngIf="getTagList(s).length > 0">
                            <span *ngFor="let tag of getTagList(s)"
                                class="rounded-full border border-[#8aab06]/40 bg-[#8aab06]/10 px-2 py-0.5 text-[10px] text-[#e5f5a3]">
                                #{{ tag }}
                            </span>
                        </div>
                    </div>

                    <!-- actions: ดันไปอยู่ล่างเสมอ -->
                    <div class="mt-auto pt-3 flex items-center justify-end gap-2">
                        <button type="button" (click)="onViewDetail(s)"
                            class="rounded-full bg-[#8aab06] px-3 py-1.5 text-[11px] font-medium text-black hover:bg-[#5B7405] transition">
                            ดูรายละเอียด
                        </button>
                    </div>

                    <!-- by: อยู่ล่างเหมือนกัน -->
                    <p *ngIf="s.createdByName" class="mt-2 text-[10px] text-white/50 text-right">
                        โดย {{ s.createdByName }}
                    </p>
                </div>
            </article>
        </div>
    </div>
</section>

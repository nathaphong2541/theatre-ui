<!-- Hero: Dark + Accent #8aab06 (clean, no emoji) -->
<section class="relative text-white bg-gradient-to-r from-black via-[#0b1a20] to-[#0b1a20]">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-14 sm:py-16 lg:py-20">
        <div class="grid grid-cols-1 lg:grid-cols-2 lg:items-center lg:gap-10">
            <div class="max-w-2xl">
                <h1 class="text-3xl font-bold tracking-tight sm:text-4xl lg:text-5xl leading-12"
                    i18n="@@landing_hero_text_1">
                    ศูนย์รวมศิลปินการแสดงไทย
                </h1>
                <p i18n="@@landing_hero_text_3"
                    class="mt-4 sm:mt-5 text-base sm:text-lg leading-7 sm:leading-8 text-[#8aab06]">
                    พื้นที่สำหรับศิลปินนักแสดงชาวไทย
                </p>

                <div class="mt-6 sm:mt-8 flex flex-col sm:flex-row sm:flex-wrap gap-3">
                    <a routerLink="/talents"
                        class="inline-flex items-center justify-center gap-2 rounded-lg bg-[#8aab06] px-5 sm:px-6 py-3 text-base font-semibold text-black shadow hover:brightness-110 transition focus:outline-none focus:ring-2 focus:ring-[#8aab06]/60 w-full sm:w-auto">
                        <!-- icon: search -->
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="11" cy="11" r="7" stroke-width="2" />
                            <path d="M20 20l-3.5-3.5" stroke-width="2" />
                        </svg>
                        <label for="" i18n="@@landing_hero_button_1">ศิลปิน</label>
                    </a>

                    <a routerLink="/jobs"
                        class="inline-flex items-center justify-center gap-2 rounded-lg border border-white/15 bg-white/5 px-5 sm:px-6 py-3 text-base font-semibold text-white backdrop-blur hover:bg-white/10 transition focus:outline-none focus:ring-2 focus:ring-white/40 w-full sm:w-auto">
                        <!-- icon: briefcase -->
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M3 10h18v9H3z" stroke-width="2" />
                            <path d="M8 10V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3" stroke-width="2" />
                        </svg>
                        <label for="" i18n="@@landing_hero_button_2">โอกาส</label>
                    </a>
                </div>
            </div>

            <div class="mt-8 lg:mt-0 lg:ml-10 flex lg:justify-end justify-center">
                <img class="w-full max-w-[325px] rounded-2xl shadow-2xl ring-1 ring-white/10"
                    src="assets/images/hero.png" alt="Thai theatre platform" loading="lazy" decoding="async" />
            </div>
        </div>
    </div>
    <div class="hidden sm:block h-1 w-full bg-gradient-to-r from-transparent via-[#8aab06] to-transparent"></div>
</section>

<!-- all-search.component.html -->
<div class="bg-main min-h-[calc(100vh-4rem)] text-white">
    <div class="mx-auto max-w-7xl px-4 lg:px-8 py-8 lg:py-10">
        <!-- Header -->
        <header class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="text-[11px] uppercase tracking-[0.3em] text-[#a3e635]/80" i18n="@@all_search_kicker">
                    DIRECTORY SEARCH
                </p>

                <h1 class="mt-1 text-2xl md:text-3xl font-semibold tracking-tight" i18n="@@all_search_title">
                    ค้นหาสมาชิกทั้งหมดในไดเรกทอรี่
                </h1>

                <p class="mt-2 text-sm text-white/70" i18n="@@all_search_desc">
                    ใช้ตัวกรองด้านล่างเพื่อค้นหานักแสดงและทีมงานที่เหมาะกับโปรเจ็กต์ของคุณ —
                    เลือกแผนก, ตำแหน่ง, ทักษะ, สถานที่ทำงาน และเงื่อนไขอื่น ๆ ได้อย่างละเอียด
                </p>
            </div>

            <button type="button" (click)="backToLanding()" class="inline-flex items-center justify-center rounded-full border border-white/20
               px-4 py-2 text-xs md:text-sm font-medium text-white/80
               hover:bg-white/10 hover:text-white transition">
                <span aria-hidden="true">←</span>
                <span class="ml-2" i18n="@@all_search_back_home">กลับหน้าแรก</span>
            </button>
        </header>

        <!-- Divider -->
        <div class="mb-6 h-px bg-gradient-to-r from-white/10 via-white/5 to-transparent"></div>

        <!-- 🔍 Main Search Zone -->
        <section [showAllSearch]="false" info-search></section>
    </div>
</div>

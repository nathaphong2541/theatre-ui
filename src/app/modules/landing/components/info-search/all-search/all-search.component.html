<!-- all-search.component.html -->
<div class="relative overflow-hidden bg-[#0b1417] min-h-[calc(100vh-4rem)] text-white">
    <!-- background glow -->
    <div class="pointer-events-none absolute inset-0 opacity-65
    bg-[radial-gradient(circle_at_20%_10%,rgba(28,197,201,0.18),transparent_55%),
        radial-gradient(circle_at_85%_0%,rgba(15,110,115,0.16),transparent_60%),
        radial-gradient(circle_at_50%_110%,rgba(0,0,0,0.55),transparent_65%)]"></div>

    <!-- film overlay -->
    <div class="pointer-events-none absolute inset-0 bg-black/15"></div>

    <div class="relative mx-auto px-4 lg:px-8 py-8 lg:py-10">
        <!-- Header -->
        <header class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <p class="text-[11px] uppercase tracking-[0.3em] text-[#bffcff]/70" i18n="@@all_search_kicker">
                    DIRECTORY SEARCH
                </p>

                <h1 class="mt-1 text-2xl md:text-3xl font-extrabold tracking-tight
                 bg-gradient-to-br from-[#0a4f52] via-[#147c7f] to-[#0f6e73]
                 bg-clip-text text-transparent
                 drop-shadow-[0_10px_45px_rgba(0,0,0,0.9)]
                 [text-shadow:0_0_40px_rgba(20,124,127,0.45)]" i18n="@@all_search_title">
                    ค้นหาสมาชิกทั้งหมดในไดเรกทอรี่
                </h1>

                <p class="mt-2 text-sm text-white/70 max-w-3xl leading-relaxed" i18n="@@all_search_desc">
                    ใช้ตัวกรองด้านล่างเพื่อค้นหานักแสดงและทีมงานที่เหมาะกับโปรเจ็กต์ของคุณ —
                    เลือกแผนก, ตำแหน่ง, ทักษะ, สถานที่ทำงาน และเงื่อนไขอื่น ๆ ได้อย่างละเอียด
                </p>
            </div>

            <button type="button" (click)="backToLanding()" class="group inline-flex items-center justify-center gap-2 rounded-full
               border border-[#19a7aa]/35 bg-white/5 backdrop-blur
               px-4 py-2 text-xs md:text-sm font-semibold tracking-wide text-white/85

               shadow-[0_10px_30px_rgba(15,110,115,0.18)]
               transition-all duration-300

               hover:bg-white/10 hover:border-[#1cc5c9]/60
               hover:shadow-[0_14px_45px_rgba(20,124,127,0.35)]
               hover:-translate-y-[1px]
               active:translate-y-0

               focus:outline-none
               focus:ring-2 focus:ring-[#1cc5c9]/55
               focus:ring-offset-2 focus:ring-offset-[#0b1417]">
                <span aria-hidden="true" class="text-base leading-none">←</span>
                <span i18n="@@all_search_back_home">กลับหน้าแรก</span>
            </button>
        </header>

        <!-- Divider -->
        <div class="mb-6 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>

        <!-- 🔍 Main Search Zone (wrap to match theme) -->
        <div class="rounded-3xl border border-[#19a7aa]/20 bg-white/5 backdrop-blur-xl
                shadow-[0_25px_80px_rgba(0,0,0,0.60)]
                p-4 sm:p-5 md:p-6">
            <section [showAllSearch]="false" info-search></section>
        </div>
    </div>
</div>

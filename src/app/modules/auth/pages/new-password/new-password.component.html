<div class="min-h-screen flex items-center justify-center px-4 bg-[#02060a]">
  <div class="w-full max-w-md p-8 rounded-2xl bg-gradient-to-br from-[#0f1722] via-[#0b1418] to-[#05080d]
           border border-white/10 shadow-[0_18px_60px_rgba(0,0,0,0.7)]">
    <app-language-menu class="absolute top-4 right-4 z-20"></app-language-menu>

    <!-- Header -->
    <div class="text-center mb-7">
      <h2 class="text-3xl font-semibold text-white tracking-tight">Setup New Password</h2>
    </div>

    <!-- Global error when link invalid -->
    <div *ngIf="error && !token"
      class="mb-4 rounded-lg bg-red-500/10 border border-red-500/40 px-3 py-2 text-sm text-red-300">
      {{ error }}
    </div>

    <!-- Form -->
    <form class="space-y-6" (ngSubmit)="onSubmit()">

      <!-- New Password -->
      <div>
        <label class="flex items-center justify-between text-white text-sm font-medium">
          <span>New Password</span>
          <span class="text-[11px] text-white/40">min 8 characters</span>
        </label>

        <div class="relative mt-1">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required
            minlength="8" class="w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white
                   placeholder:text-white/30 outline-none focus:ring-2 focus:ring-lime-400 focus:border-lime-400
                   transition-all duration-150" placeholder="Enter new password" [disabled]="isSubmitting"
            (input)="onPasswordInput($event)" />


          <!-- 👁 ปุ่มดวงตา -->
          <span class="absolute top-3 right-3 text-white/60 hover:text-white/90 cursor-pointer"
            (click)="togglePassword()">
            <svg-icon *ngIf="showPassword" src="assets/icons/heroicons/outline/eye-b-off.svg" [svgClass]="'h-5 w-5'">
            </svg-icon>

            <svg-icon *ngIf="!showPassword" src="assets/icons/heroicons/outline/eye-b.svg" [svgClass]="'h-5 w-5'">
            </svg-icon>
          </span>
        </div>

        <!-- Password strength bar -->
        <div class="mt-3 space-y-1">
          <div class="grid grid-cols-4 gap-2">
            <div class="h-1.5 rounded-full transition-colors duration-200" [ngClass]="passwordBarClass(1)"></div>
            <div class="h-1.5 rounded-full transition-colors duration-200" [ngClass]="passwordBarClass(2)"></div>
            <div class="h-1.5 rounded-full transition-colors duration-200" [ngClass]="passwordBarClass(3)"></div>
            <div class="h-1.5 rounded-full transition-colors duration-200" [ngClass]="passwordBarClass(4)"></div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-white/50">
            <span>Password strength</span>
            <span [ngClass]="{
                'text-red-400': passwordScore <= 1,
                'text-yellow-300': passwordScore === 2,
                'text-emerald-400': passwordScore >= 3
              }" class="font-medium">
              {{ passwordStrengthLabel }}
            </span>
          </div>

          <p class="text-white/40 text-[11px]">
            Use a mix of uppercase, numbers, and symbols for better security.
          </p>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="text-white text-sm font-medium">Confirm Password</label>
        <div class="relative mt-1">

          <input [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword"
            required class="w-full px-4 py-3 rounded-lg bg-white/10 border text-white
                   outline-none transition-all duration-150
                   placeholder:text-white/30" [ngClass]="{
              'border-red-500 focus:ring-2 focus:ring-red-500 focus:border-red-500': showMismatchError,
              'border-white/20 focus:ring-2 focus:ring-lime-400 focus:border-lime-400': !showMismatchError
            }" placeholder="Re-enter password" [disabled]="isSubmitting" (input)="onConfirmPasswordInput($event)" />


          <!-- 👁 ปุ่มดวงตา confirm -->
          <span class="absolute top-3 right-3 text-white/60 hover:text-white/90 cursor-pointer"
            (click)="toggleConfirmPassword()">
            <svg-icon *ngIf="showConfirmPassword" src="assets/icons/heroicons/outline/eye-b-off.svg"
              [svgClass]="'h-5 w-5'">
            </svg-icon>

            <svg-icon *ngIf="!showConfirmPassword" src="assets/icons/heroicons/outline/eye-b.svg"
              [svgClass]="'h-5 w-5'">
            </svg-icon>
          </span>
        </div>

        <!-- error when not match -->
        <p *ngIf="showMismatchError" class="mt-1 text-xs text-red-400">
          Passwords do not match.
        </p>
      </div>

      <!-- Error / Success -->
      <p *ngIf="error && token" class="text-red-400 text-sm">{{ error }}</p>
      <p *ngIf="success" class="text-emerald-400 text-sm">{{ success }}</p>

      <!-- Submit -->
      <app-button type="submit" full impact="bold" tone="primary" shape="rounded" size="medium" [disabled]="!canSubmit">
        {{ isSubmitting ? 'Saving...' : 'Submit' }}
      </app-button>
    </form>
  </div>
</div>

<div class="min-h-screen flex items-center justify-center px-4 bg-[#0d1418]">
  <div class="w-full max-w-md p-8 rounded-2xl bg-[#10181d] border border-white/10 shadow-[0_8px_30px_rgba(0,0,0,0.3)]">
    <app-language-menu class="absolute top-4 right-4 z-20"></app-language-menu>
    <!-- Title -->
    <div class="text-center mb-7">
      <h2 class="text-3xl font-semibold text-white">Forgot Password</h2>
      <p class="text-white/50 mt-2 text-sm">
        Enter your email address and we’ll send you a reset link.
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Email -->

      <div>
        <label for="email" class="text-white text-sm font-medium">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required [disabled]="isSubmitting"
          (input)="onEmailInput($event)" class="mt-1 w-full px-4 py-3 rounded-lg bg-white/10 border border-white/20 text-white
           placeholder:text-white/40 outline-none focus:ring-2 focus:ring-primary focus:border-primary"
          placeholder="Enter your email" />
      </div>

      <!-- Error -->
      <p *ngIf="error" class="text-red-400 text-sm">{{ error }}</p>
      <p *ngIf="success" class="text-emerald-400 text-sm">{{ success }}</p>

      <!-- Submit -->
      <button type="submit"
        class="w-full py-3 rounded-lg bg-lime-600 hover:bg-lime-500 text-black font-semibold transition disabled:opacity-60 disabled:cursor-not-allowed"
        [disabled]="isSubmitting">
        {{ isSubmitting ? 'Sending...' : 'Send reset link' }}
      </button>

      <!-- Back to login -->
      <div class="text-center mt-4">
        <a [routerLink]="loginLink()" class="text-white/60 hover:text-white text-sm">
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
